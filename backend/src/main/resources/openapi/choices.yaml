paths:
  History:
    get:
      tags: [choices]
      operationId: getChoicesHistory
      parameters:
        - {in: query, name: date, required: true, schema: {type: string, format: date}}
        - {in: query, name: days, required: true, schema: {type: integer, enum: [7, 30]}}
      responses:
        '200':
          description: Daily scores, including zeroes, ending on the selected date.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChoicesHistory'}
        '400': {description: Invalid date or range.}
  Adjust:
    post:
      tags: [choices]
      operationId: adjustChoices
      parameters:
        - {in: path, name: date, required: true, schema: {type: string, format: date}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChoicesAdjustment'}
      responses:
        '200':
          description: Saved daily score.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChoicesDay'}
        '400': {description: Invalid delta or future date.}
components:
  schemas:
    ChoicesAdjustment:
      type: object
      required: [delta]
      properties:
        delta: {type: number, minimum: -1, maximum: 1, multipleOf: 1, description: Must be exactly -1 or 1; fractional values are rejected.}
    ChoicesDay:
      type: object
      required: [date, score]
      properties:
        date: {type: string, format: date}
        score: {type: integer}
    ChoicesHistory:
      type: object
      required: [date, score, editable, series]
      properties:
        date: {type: string, format: date}
        score: {type: integer}
        editable: {type: boolean, description: Whether date is today or earlier in Europe/Zurich.}
        series:
          type: array
          items: {$ref: '#/components/schemas/ChoicesDay'}
