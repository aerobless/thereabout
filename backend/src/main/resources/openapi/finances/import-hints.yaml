paths:
  _hints:
    get:
      tags: [Finances]
      operationId: financeListImportHints
      summary: List saved account import hints
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Hints in creation order, shared across finance users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceImportHintList'}
    post:
      tags: [Finances]
      operationId: financeAddImportHint
      summary: Save an account hint for future imports
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinanceImportHintInput'}
      responses:
        '200':
          description: Saved hint. Does not change existing import drafts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceImportHint'}
  _hint:
    delete:
      tags: [Finances]
      operationId: financeRemoveImportHint
      summary: Remove a saved account import hint
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: hintId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinanceImportHintRemoveInput'}
      responses:
        '200':
          description: Removed hint, retained in audit history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceImportHint'}
components:
  schemas:
    FinanceImportHint:
      type: object
      additionalProperties: false
      required: [id, accountId, text, version, createdAt]
      properties:
        id: {type: integer, format: int64}
        accountId: {type: integer, format: int64}
        text: {type: string, maxLength: 1000}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    FinanceImportHintList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/FinanceImportHint'}
    FinanceImportHintQuery:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId: {type: integer, format: int64, minimum: 1}
    FinanceImportHintInput:
      type: object
      additionalProperties: false
      required: [accountId, text, requestKey]
      properties:
        accountId: {type: integer, format: int64, minimum: 1}
        text: {type: string, minLength: 1, maxLength: 1000}
        requestKey: {type: string, minLength: 1, maxLength: 100}
    FinanceImportHintRemoveInput:
      type: object
      additionalProperties: false
      required: [accountId, id, version, requestKey]
      properties:
        accountId: {type: integer, format: int64, minimum: 1}
        id: {type: integer, format: int64, minimum: 1}
        version: {type: integer, format: int64, minimum: 0}
        requestKey: {type: string, minLength: 1, maxLength: 100}
