paths:
  _currencies:
    get:
      operationId: financeCurrencies
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceCurrencyList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
  _rates:
    get:
      operationId: financeListRates
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceRateList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      parameters:
      - name: fromCurrency
        in: query
        required: false
        schema:
          type: string
      - name: date
        in: query
        required: false
        schema:
          type: string
      x-mcp-input:
        $ref: '#/components/schemas/FinanceRateQuery'
  _rates_manual:
    put:
      operationId: financeSaveRate
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceRateResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceRateInput'
  _rates_refresh:
    post:
      operationId: financeRefreshRates
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceRateRefreshResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceRefreshInput'
components:
  schemas:
    FinanceCurrency:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimalPlaces:
          type: integer
          format: int64
        enabled:
          type: boolean
      required:
      - code
      - name
      - symbol
      - decimalPlaces
      - enabled
    FinanceRate:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        fromCurrency:
          type: string
        toCurrency:
          type: string
        rateDate:
          type: string
        rate:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
        source:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - id
      - fromCurrency
      - toCurrency
      - rateDate
      - rate
      - source
      - version
    FinanceRateRefreshResult:
      type: object
      additionalProperties: false
      properties:
        saved:
          type: integer
          format: int64
        latestDate:
          type: string
        source:
          type: string
      required:
      - saved
      - latestDate
      - source
    FinanceQuote:
      type: object
      additionalProperties: false
      properties:
        requested:
          type: string
        date:
          type: string
        source:
          type: string
        rate:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
      required:
      - requested
      - date
      - source
      - rate
    FinanceRateList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceRate'
      required:
      - items
    FinanceCurrencyList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceCurrency'
      required:
      - items
    FinanceRateResult:
      type: object
      additionalProperties: false
      properties:
        rate:
          $ref: '#/components/schemas/FinanceRate'
      required:
      - rate
    FinanceRateInput:
      type: object
      additionalProperties: false
      properties:
        requestKey:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: integer
          format: int64
          minimum: 0
        fromCurrency:
          type: string
        toCurrency:
          type: string
        date:
          type: string
        rate:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
          x-field-extra-annotation: '@tools.jackson.databind.annotation.JsonDeserialize(using = com.sixtymeters.thereabout.finance.transport.DecimalStringDeserializer.class)'
      required:
      - requestKey
      - fromCurrency
      - toCurrency
      - date
      - rate
    FinanceRefreshInput:
      type: object
      additionalProperties: false
      properties:
        requestKey:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - requestKey
    FinanceRateQuery:
      type: object
      additionalProperties: false
      properties:
        fromCurrency:
          type: string
        date:
          type: string
      required: []
