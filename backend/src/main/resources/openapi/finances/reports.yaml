paths:
  _overview:
    get:
      operationId: financeOverview
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceOverview'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: accountId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      x-mcp-input:
        $ref: '#/components/schemas/FinancePeriodQuery'
  _reports_income-expenses:
