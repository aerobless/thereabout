paths:
  Catalog:
    get:
      tags: [Finances]
      operationId: financeMcpCatalog
      summary: List actual registered MCP tools without credentials; administrator only.
      responses:
        '200':
          description: Registered endpoints and tools.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceMcpCatalog'}
  _mcp-key:
    get:
      tags: [Finances]
      operationId: financeGetMcpKey
      summary: Reveal the database-backed MCP credential
      description: Requires the finance browser access boundary. Never included in general frontend configuration or exposed as an MCP tool. Responses must not be cached.
      responses:
        '200':
          description: Existing MCP bearer key
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authentication required
        '403':
          description: Request outside the allowed origin or network
        '404':
          description: Finances are disabled
components:
  schemas:
    FinanceMcpCatalog:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/FinanceMcpEndpoint'}
    FinanceMcpEndpoint:
      type: object
      required: [path, tools]
      properties:
        path: {type: string}
        tools:
          type: array
          items: {$ref: '#/components/schemas/FinanceMcpTool'}
    FinanceMcpTool:
      type: object
      required: [name, description, readOnly]
      properties:
        name: {type: string}
        description: {type: string}
        readOnly: {type: boolean}
