paths:
  _valuations_preview:
    post:
      operationId: financePreviewValuation
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceValuationPreview'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceValuationPreviewInput'
  _valuations:
    post:
      operationId: financeCreateValuation
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceValuationResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceValuationInput'
    get:
      operationId: financeListValuations
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceValuationList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: shared.yaml#/components/schemas/FinanceError
      parameters:
      - name: accountId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: id
        in: query
        schema: {type: integer, format: int64, minimum: 1}
      x-mcp-input:
        $ref: '#/components/schemas/FinanceValuationQuery'
  Delete:
    post:
      operationId: financeDeleteValuation
      tags: [Finances]
      summary: Delete a reported valuation and its adjustment atomically. Reversible; later valuations remain unchanged.
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: 'shared.yaml#/components/schemas/FinanceVersionedInput'}
      responses:
        '200':
          description: Deleted valuation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceValuation'}
  Restore:
    post:
      operationId: financeRestoreValuation
      tags: [Finances]
      summary: Restore a reported valuation and its original adjustment atomically, without rebasing later valuations.
      parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: 'shared.yaml#/components/schemas/FinanceVersionedInput'}
      responses:
        '200':
          description: Restored valuation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceValuation'}
components:
  schemas:
    FinanceValuation:
      description: A reported account value and its current linked correction. Amend with valuations.save using id and version; deletion is reversible.
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        accountId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        currency:
          type: string
        occurredAt:
          type: string
        reportedValue:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
        previousBalance:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
        transactionId:
          type: integer
          format: int64
          minimum: 1
        reference:
          type: string
        origin:
          type: string
        version: {type: integer, format: int64, minimum: 0}
        deleted: {type: boolean}
      required:
      - id
      - accountId
      - occurredAt
      - reportedValue
      - previousBalance
      - reference
      - origin
      - version
      - deleted
    FinanceValuationPreview:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
        reportedValue:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
        previousBalance:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
        laterValuations:
          type: boolean
          description: Later recorded values remain unchanged; this correction changes their ledger history.
        difference:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
        currency:
          type: string
      required:
      - accountId
      - date
      - reportedValue
      - previousBalance
      - difference
      - currency
    FinanceValuationResult:
      type: object
      additionalProperties: false
      properties:
        valuation:
          $ref: '#/components/schemas/FinanceValuation'
        preview:
          $ref: '#/components/schemas/FinanceValuationPreview'
      required:
      - valuation
      - preview
    FinanceValuationList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceValuation'
      required:
      - items
    FinanceValuationPreviewInput:
      description: Supply id and its current version to amend an existing valuation. Preview excludes its old correction.
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1}
        version: {type: integer, format: int64, minimum: 0}
        accountId:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
        reportedValue:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
          x-field-extra-annotation: '@tools.jackson.databind.annotation.JsonDeserialize(using = com.sixtymeters.thereabout.finance.transport.DecimalStringDeserializer.class)'
      required:
      - accountId
      - date
      - reportedValue
    FinanceValuationInput:
      description: Supply id and its current version to amend an existing valuation. Preview excludes its old correction.
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1}
        version: {type: integer, format: int64, minimum: 0}
        requestKey:
          type: string
          minLength: 1
          maxLength: 100
        accountId:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
        reportedValue:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
          x-field-extra-annotation: '@tools.jackson.databind.annotation.JsonDeserialize(using = com.sixtymeters.thereabout.finance.transport.DecimalStringDeserializer.class)'
        expectedBalance:
          type: string
          pattern: ^-?\d{1,12}(\.\d{1,24})?$
          example: '123.45'
          x-field-extra-annotation: '@tools.jackson.databind.annotation.JsonDeserialize(using = com.sixtymeters.thereabout.finance.transport.DecimalStringDeserializer.class)'
        reference:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - requestKey
      - accountId
      - date
      - reportedValue
      - expectedBalance
      - reference
    FinanceValuationQuery:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, format: int64, minimum: 1}
        accountId:
          type: integer
          format: int64
          minimum: 0
      required: []
