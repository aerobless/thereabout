    404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    500:
      description: Generic Internal Server Error Response
      content:
