# Main API spec; component schemas are in openapi/*.yaml
openapi: "3.0.2"
info:
  title: Frontend REST API
  version: "1.0"
paths:
  /backend/api/v1/launcher:
    $ref: 'openapi/launcher.yaml#/paths/Collection'
  /backend/api/v1/launcher/groups:
    $ref: 'openapi/launcher.yaml#/paths/Groups'
  /backend/api/v1/launcher/groups/{id}:
    $ref: 'openapi/launcher.yaml#/paths/Group'
  /backend/api/v1/launcher/groups/order:
    $ref: 'openapi/launcher.yaml#/paths/GroupOrder'
  /backend/api/v1/launcher/groups/{id}/shortcuts/order:
    $ref: 'openapi/launcher.yaml#/paths/ShortcutOrder'
  /backend/api/v1/launcher/shortcuts:
    $ref: 'openapi/launcher.yaml#/paths/Shortcuts'
  /backend/api/v1/launcher/shortcuts/{id}:
    $ref: 'openapi/launcher.yaml#/paths/Shortcut'
  /backend/api/v1/launcher/import:
    $ref: 'openapi/launcher.yaml#/paths/Import'
  /backend/api/v1/launcher/shortcuts/{id}/icon:
    $ref: 'openapi/launcher.yaml#/paths/Icon'
  /backend/api/v1/launcher/shortcuts/{id}/icon/refresh:
    $ref: 'openapi/launcher.yaml#/paths/IconRefresh'
  /backend/api/v1/calendar/google/status:
    $ref: 'openapi/calendar.yaml#/paths/Status'
  /backend/api/v1/calendar/google/secrets:
    $ref: 'openapi/calendar.yaml#/paths/Secrets'
  /backend/api/v1/calendar/google/secrets/{key}:
    $ref: 'openapi/calendar.yaml#/paths/Reveal'
  /backend/api/v1/calendar/google/webhook:
    $ref: 'openapi/calendar.yaml#/paths/Webhook'
  /backend/api/v1/calendar/google/calendars:
    $ref: 'openapi/calendar.yaml#/paths/Calendars'
  /backend/api/v1/calendar/google/import:
    $ref: 'openapi/calendar.yaml#/paths/Import'
  /backend/api/v1/calendar/google/sync:
    $ref: 'openapi/calendar.yaml#/paths/Sync'
  /backend/api/v1/calendar/google/notifications:
    $ref: 'openapi/calendar.yaml#/paths/Notifications'
  /backend/api/v1/calendar/upcoming:
    $ref: 'openapi/calendar.yaml#/paths/Upcoming'
  /backend/api/v1/calendar/day:
    $ref: 'openapi/calendar.yaml#/paths/Day'
  /backend/api/v1/calendar/{calendarId}/events/{eventId}:
    $ref: 'openapi/calendar.yaml#/paths/Delete'
  /backend/api/v1/choices:
    $ref: 'openapi/choices.yaml#/paths/History'
  /backend/api/v1/choices/{date}/adjust:
    $ref: 'openapi/choices.yaml#/paths/Adjust'
  # Location
  /backend/api/v1/location/sparse:
    $ref: 'openapi/location.yaml#/paths/LocationSparse'
  /backend/api/v1/location:
    $ref: 'openapi/location.yaml#/paths/Location'
  /backend/api/v1/location/geojson:
    $ref: 'openapi/location.yaml#/paths/LocationGeojson'
  /backend/api/v1/location/{id}:
    $ref: 'openapi/location.yaml#/paths/LocationById'
  /backend/api/v1/statistics:
    $ref: 'openapi/location.yaml#/paths/Statistics'
  # Client
  /backend/api/v1/config:
    $ref: 'openapi/client.yaml#/paths/Config'
  /backend/api/v1/config/import-file:
    $ref: 'openapi/client.yaml#/paths/ConfigImportFile'
  /backend/api/v1/config/telegram:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegram'
  /backend/api/v1/config/telegram/connect:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegramConnect'
  /backend/api/v1/config/telegram/code:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegramCode'
  /backend/api/v1/config/telegram/password:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegramPassword'
  /backend/api/v1/config/telegram/resync:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegramResync'
  /backend/api/v1/config/telegram/resync/cancel:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegramResyncCancel'
  /backend/api/v1/config/telegram/disconnect:
    $ref: 'openapi/client.yaml#/paths/ConfigTelegramDisconnect'

  /backend/api/v1/preferences:
    $ref: 'openapi/weight.yaml#/paths/Preferences'
  /backend/api/v1/health/weight-progress:
    $ref: 'openapi/weight.yaml#/paths/WeightProgress'

  # Health
  /backend/api/v1/health/heart-rate:
    $ref: 'openapi/heart.yaml#/paths/HeartRateHistory'
  /backend/api/v1/health/hrv:
    $ref: 'openapi/heart.yaml#/paths/HrvHistory'
  /backend/api/v1/health:
    $ref: 'openapi/health.yaml#/paths/Health'
  /backend/api/v1/health/data:
    $ref: 'openapi/health.yaml#/paths/HealthData'

  # Communication
  /backend/api/v1/identity:
    $ref: 'openapi/communication.yaml#/paths/Identity'
  /backend/api/v1/identity/{id}:
    $ref: 'openapi/communication.yaml#/paths/IdentityById'
  /backend/api/v1/identity-in-application:
    $ref: 'openapi/communication.yaml#/paths/IdentityInApplicationByApplication'
  /backend/api/v1/identity-in-application/unlinked:
    $ref: 'openapi/communication.yaml#/paths/IdentityInApplicationUnlinked'
  /backend/api/v1/identity-in-application/{id}/link/{identityId}:
    $ref: 'openapi/communication.yaml#/paths/IdentityInApplicationLink'
  /backend/api/v1/identity-in-application/{id}/unlink:
    $ref: 'openapi/communication.yaml#/paths/IdentityInApplicationUnlink'
  /backend/api/v1/message:
    $ref: 'openapi/communication.yaml#/paths/Message'
  /backend/api/v1/message/list:
    $ref: 'openapi/communication.yaml#/paths/MessageList'

components:
  schemas:
    LauncherGroupInput:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherGroupInput'
    LauncherGroup:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherGroup'
    LauncherLink:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherLink'
    LauncherShortcutInput:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherShortcutInput'
    LauncherShortcut:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherShortcut'
    LauncherCollection:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherCollection'
    LauncherOrder:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherOrder'
    LauncherImportGroup:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherImportGroup'
    LauncherImport:
      $ref: 'openapi/launcher.yaml#/components/schemas/LauncherImport'
    GoogleSecretStatus:
      $ref: 'openapi/calendar.yaml#/components/schemas/GoogleSecretStatus'
    GoogleCredentials:
      $ref: 'openapi/calendar.yaml#/components/schemas/GoogleCredentials'
    CalendarSecretValue:
      $ref: 'openapi/calendar.yaml#/components/schemas/CalendarSecretValue'
    CalendarWebhookSettings:
      $ref: 'openapi/calendar.yaml#/components/schemas/CalendarWebhookSettings'
    CalendarSelection:
      $ref: 'openapi/calendar.yaml#/components/schemas/CalendarSelection'
    CalendarInfo:
      $ref: 'openapi/calendar.yaml#/components/schemas/CalendarInfo'
    GoogleCalendarStatus:
      $ref: 'openapi/calendar.yaml#/components/schemas/GoogleCalendarStatus'
    CalendarGuest:
      $ref: 'openapi/calendar.yaml#/components/schemas/CalendarGuest'
    CalendarOccurrence:
      $ref: 'openapi/calendar.yaml#/components/schemas/CalendarOccurrence'
    # Shared
    ThereaboutBaseErrorModel:
      type: object
      required:
        - requestId
        - errorMessageParameters
        - errorMessageTranslationKey
        - extraInformation
      properties:
        requestId:
          type: string
        errorMessageTranslationKey:
          type: string
        errorMessageParameters:
          type: array
          items:
            type: string
        extraInformation:
          type: string
        stacktrace:
          type: string

    # Client
    FrontendConfigurationResponse:
      $ref: 'openapi/client.yaml#/components/schemas/FrontendConfigurationResponse'
    VersionDetails:
      $ref: 'openapi/client.yaml#/components/schemas/VersionDetails'
    FileImportStatus:
      $ref: 'openapi/client.yaml#/components/schemas/FileImportStatus'
    ImportType:
      $ref: 'openapi/client.yaml#/components/schemas/ImportType'
    TelegramStatus:
      $ref: 'openapi/client.yaml#/components/schemas/TelegramStatus'
    TelegramConnectRequest:
      $ref: 'openapi/client.yaml#/components/schemas/TelegramConnectRequest'
    TelegramCodeRequest:
      $ref: 'openapi/client.yaml#/components/schemas/TelegramCodeRequest'
    TelegramPasswordRequest:
      $ref: 'openapi/client.yaml#/components/schemas/TelegramPasswordRequest'

    # Location
    UserStatistics:
      $ref: 'openapi/location.yaml#/components/schemas/UserStatistics'
    CountryStatistic:
      $ref: 'openapi/location.yaml#/components/schemas/CountryStatistic'
    SparseLocationHistoryResponse:
      $ref: 'openapi/location.yaml#/components/schemas/SparseLocationHistoryResponse'
    LocationHistoryResponse:
      $ref: 'openapi/location.yaml#/components/schemas/LocationHistoryResponse'
    SparseLocationHistoryEntry:
      $ref: 'openapi/location.yaml#/components/schemas/SparseLocationHistoryEntry'
    LocationHistoryEntry:
      $ref: 'openapi/location.yaml#/components/schemas/LocationHistoryEntry'
    GeoJsonLocation:
      $ref: 'openapi/location.yaml#/components/schemas/GeoJsonLocation'
    Preferences:
      $ref: 'openapi/weight.yaml#/components/schemas/Preferences'
    UpdatePreferences:
      $ref: 'openapi/weight.yaml#/components/schemas/UpdatePreferences'
    WeightDay:
      $ref: 'openapi/weight.yaml#/components/schemas/WeightDay'
    WeightProgress:
      $ref: 'openapi/weight.yaml#/components/schemas/WeightProgress'
    # Health
    HeartRateDay:
      $ref: 'openapi/heart.yaml#/components/schemas/HeartRateDay'
    HeartRateHistory:
      $ref: 'openapi/heart.yaml#/components/schemas/HeartRateHistory'
    HrvDay:
      $ref: 'openapi/heart.yaml#/components/schemas/HrvDay'
    HrvHistory:
      $ref: 'openapi/heart.yaml#/components/schemas/HrvHistory'
    HealthData:
      $ref: 'openapi/health.yaml#/components/schemas/HealthData'
    HealthMetric:
      $ref: 'openapi/health.yaml#/components/schemas/HealthMetric'
    MetricDataQuantity:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataQuantity'
    MetricDataBloodPressure:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataBloodPressure'
    MetricDataHeartRate:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataHeartRate'
    MetricDataSleep:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataSleep'
    MetricDataBloodGlucose:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataBloodGlucose'
    MetricDataSexualActivity:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataSexualActivity'
    MetricDataHandwashing:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataHandwashing'
    MetricDataToothbrushing:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataToothbrushing'
    MetricDataInsulin:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataInsulin'
    MetricDataHeartRateNotification:
      $ref: 'openapi/health.yaml#/components/schemas/MetricDataHeartRateNotification'
    Workout:
      $ref: 'openapi/health.yaml#/components/schemas/Workout'
    QuantityData:
      $ref: 'openapi/health.yaml#/components/schemas/QuantityData'
    WorkoutHeartRateData:
      $ref: 'openapi/health.yaml#/components/schemas/WorkoutHeartRateData'
    RouteData:
      $ref: 'openapi/health.yaml#/components/schemas/RouteData'
    Energy:
      $ref: 'openapi/health.yaml#/components/schemas/Energy'
    HeartRate:
      $ref: 'openapi/health.yaml#/components/schemas/HeartRate'
    StepData:
      $ref: 'openapi/health.yaml#/components/schemas/StepData'
    StepCadence:
      $ref: 'openapi/health.yaml#/components/schemas/StepCadence'
    SwimmingData:
      $ref: 'openapi/health.yaml#/components/schemas/SwimmingData'
    SwimmingCadence:
      $ref: 'openapi/health.yaml#/components/schemas/SwimmingCadence'
    Distance:
      $ref: 'openapi/health.yaml#/components/schemas/Distance'
    Speed:
      $ref: 'openapi/health.yaml#/components/schemas/Speed'
    FlightsClimbed:
      $ref: 'openapi/health.yaml#/components/schemas/FlightsClimbed'
    Intensity:
      $ref: 'openapi/health.yaml#/components/schemas/Intensity'
    Temperature:
      $ref: 'openapi/health.yaml#/components/schemas/Temperature'
    Humidity:
      $ref: 'openapi/health.yaml#/components/schemas/Humidity'
    Elevation:
      $ref: 'openapi/health.yaml#/components/schemas/Elevation'
    HealthDataResponse:
      $ref: 'openapi/health.yaml#/components/schemas/HealthDataResponse'
    DailyMetricValue:
      $ref: 'openapi/health.yaml#/components/schemas/DailyMetricValue'
    WorkoutSummary:
      $ref: 'openapi/health.yaml#/components/schemas/WorkoutSummary'

    # Communication
    Identity:
      $ref: 'openapi/communication.yaml#/components/schemas/Identity'
    IdentityInApplication:
      $ref: 'openapi/communication.yaml#/components/schemas/IdentityInApplication'
    Message:
      $ref: 'openapi/communication.yaml#/components/schemas/Message'
    MessagePage:
      $ref: 'openapi/communication.yaml#/components/schemas/MessagePage'
    MessageParticipant:
      $ref: 'openapi/communication.yaml#/components/schemas/MessageParticipant'

  responses:
    400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    500:
      description: Generic Internal Server Error Response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
    502:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ThereaboutBaseErrorModel"
