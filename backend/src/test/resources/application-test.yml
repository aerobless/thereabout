spring:
  datasource:
    url: ${THEREABOUT_TEST_DB_URL:jdbc:mariadb://127.0.0.1:3307/thereabout_test}
    username: ${THEREABOUT_TEST_DB_USER:thereabout_test}
    password: ${THEREABOUT_TEST_DB_PASSWORD:test-only}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: filesystem:target/test-migrations
    enabled: true
    clean-disabled: true
thereabout:
  splitwise:
    worker-enabled: false
  apiKeys:
    googleMaps: NO_KEY_NEEDED_FOR_TESTS
  calendar:
    worker-enabled: false
  launcher:
    fetch-icons: false
  telegram:
    tdlib:
      api-id: 0
      api-hash: ""
      database-directory: /tmp/thereabout-telegram-tdlib-test
