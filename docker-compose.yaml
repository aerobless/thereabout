services:
  mariadb:
    image: 'mariadb:latest'
    environment:
      MARIADB_DATABASE: ${THEREABOUT_DATABASE}
      MARIADB_USER: ${THEREABOUT_DB_USER}
      MARIADB_PASSWORD: ${THEREABOUT_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${THEREABOUT_DB_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - thereabout_data:/var/lib/mysql
  thereabout:
    image: 'aerobless/thereabout:latest'
    ports:
      - '9050:9050'
    volumes:
      - thereabout_data:/data
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      THEREABOUT_DATABASE: ${THEREABOUT_DATABASE}
      THEREABOUT_DB_USER: ${THEREABOUT_DB_USER}
      THEREABOUT_DB_PASSWORD: ${THEREABOUT_DB_PASSWORD}
      THEREABOUT_ROOT_PASSWORD: ${THEREABOUT_DB_ROOT_PASSWORD}
      THEREABOUT_ACCESS_MODE: ${THEREABOUT_ACCESS_MODE:-local}
      THEREABOUT_CLOUDFLARE_ISSUER: ${THEREABOUT_CLOUDFLARE_ISSUER:-}
      THEREABOUT_CLOUDFLARE_AUDIENCE: ${THEREABOUT_CLOUDFLARE_AUDIENCE:-}
      THEREABOUT_PUBLIC_ORIGIN: ${THEREABOUT_PUBLIC_ORIGIN:-}
    depends_on:
      - mariadb

volumes:
  thereabout_data: