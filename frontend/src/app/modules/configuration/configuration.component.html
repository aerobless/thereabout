<div class="configuration-page">
  <header class="configuration-heading">
    <div><h1>Configuration</h1><p>Manage connections, data and access.</p></div>
    <p-autocomplete inputId="configuration-search" ariaLabel="Search settings" placeholder="Search settings" [fluid]="true"
      [ngModel]="search()" (ngModelChange)="search.set($event)" [suggestions]="suggestions()" optionLabel="label"
      (completeMethod)="complete($event)" (onSelect)="select($event.value)" [forceSelection]="true"
      [showEmptyMessage]="true" emptyMessage="No matching settings" appendTo="body">
      <ng-template #item let-result><div class="configuration-search-result"><strong>{{ result.label }}</strong><small>{{ result.category }}</small></div></ng-template>
    </p-autocomplete>
  </header>
  <nav class="configuration-tabs" aria-label="Configuration navigation">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ tab.label }}</a>
    }
  </nav>
  <router-outlet />
</div>
<app-modal header="Discard unsaved changes?" [visible]="navigation.confirming()" (visibleChange)="!$event && navigation.answer(false)"
  [dialogStyle]="{width: '28rem', maxWidth: 'calc(100vw - 2rem)'}">
  <p>Your changes have not been saved.</p>
  <ng-template #footer>
    <p-button label="Stay" severity="secondary" (onClick)="navigation.answer(false)" />
    <p-button label="Discard changes" severity="danger" (onClick)="navigation.answer(true)" />
  </ng-template>
</app-modal>
