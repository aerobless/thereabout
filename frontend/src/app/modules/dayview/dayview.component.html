<div class="page-heading dayview-heading">
  <h1>{{ selectedDate | date:'EEEE d' }}{{ selectedDaySuffix }}</h1>
  <div class="date-navigation">
    <p-button icon="pi pi-chevron-left" ariaLabel="Previous day" (onClick)="goToPreviousDay()"
      pTooltip="Previous Day" tooltipPosition="bottom" showDelay="500"
      severity="secondary" [outlined]="true" styleClass="date-nav-button"></p-button>
    <p-datepicker #dayDatePicker [(ngModel)]="selectedDate"
      [dateFormat]="location.mobileLocationView() ? 'D, d M yy' : 'D, d MM yy'"
      ariaLabel="Selected day" appendTo="body" panelStyleClass="dayview-date-panel"
      [touchUI]="location.mobileLocationView()" [readonlyInput]="location.mobileLocationView()"
      (onSelect)="onDateChange()"
      class="date-selector"></p-datepicker>
    <p-button icon="pi pi-chevron-right" ariaLabel="Next day" (onClick)="goToNextDay()"
      pTooltip="Next Day" tooltipPosition="bottom" showDelay="500"
      severity="secondary" [outlined]="true" styleClass="date-nav-button"></p-button>
    <p-button [icon]="location.mobileLocationView() ? undefined : 'pi pi-calendar'" [size]="location.mobileLocationView() ? 'small' : undefined"
      ariaLabel="Today" label="Today" styleClass="today-btn" (onClick)="goToToday()"
      pTooltip="Jump to Today" tooltipPosition="bottom" showDelay="500"
      severity="secondary" [outlined]="true" class="today-control"></p-button>
  </div>
</div>

<!-- Two-Column Card Container -->
<div class="dayview-cards-region">
<div class="card-container">

  <!-- Left Column: map and calendar -->
  <div class="column-left">

    <!-- Location History Map Card -->
    <app-day-location (dateChange)="setDateAndUpdateUrl($event)" />

    <app-calendar-card class="card-calendar" [date]="dateToString(selectedDate)" />

  </div>

  <!-- Right Column: daily stats and workouts -->
  <div class="column-right">

    <!-- Daily stats -->
    <div class="daily-stats-grid">
      <app-day-steps />
      <app-energy-card [date]="dateToString(selectedDate)" [activeRecords]="health.activeEnergyRecords()" [basalRecords]="health.basalEnergyRecords()"
        [loading]="health.stepsLoading()" [error]="health.stepsError()" (retry)="health.loadHealthData()"></app-energy-card>
      <app-choices-card [date]="dateToString(selectedDate)"></app-choices-card>
      <app-weight-card [date]="dateToString(selectedDate)"></app-weight-card>
      <app-heart-rate-card [date]="dateToString(selectedDate)"></app-heart-rate-card>
      <app-hrv-card [date]="dateToString(selectedDate)"></app-hrv-card>
      <app-duration-card kind="stand" [date]="dateToString(selectedDate)" [records]="health.standRecords()" [loading]="health.stepsLoading()" [error]="health.stepsError()" (retry)="health.loadHealthData()"></app-duration-card>
      <app-duration-card kind="sleep" [date]="dateToString(selectedDate)" [records]="health.sleepRecords()" [loading]="health.stepsLoading()" [error]="health.stepsError()" (retry)="health.loadHealthData()"></app-duration-card>
      <app-day-messages />
      <p-card class="dayview-card daily-stat-card card-day-links">
        <ng-template #header>
          <div class="card-header">
            <i class="pi pi-th-large card-header-icon" aria-hidden="true"></i>
            <span class="card-header-title">Apps</span>
          </div>
        </ng-template>
        <nav class="day-links" aria-label="Apps for this day">
          @for (link of dayLinks; track link.label) {
            <a [href]="link.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label + ' (opens in a new tab)'">
              <span class="launcher-icon"><i [class]="'pi ' + link.icon" aria-hidden="true"></i></span>
              <span class="launcher-label">{{ link.label }}</span>
            </a>
          }
        </nav>
      </p-card>
    </div>

    <!-- Workouts Card (hidden when no workouts for the day) -->
    @if (health.workouts().length > 0) { <app-day-workouts /> }

  </div>

</div>

</div>
