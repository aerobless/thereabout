<form [formGroup]="form" class="editor" (ngSubmit)="saveAccount()">
  <label>Name<input name="name" required formControlName="name" /></label>
  <div class="form-grid">
    <label
      >Kind<p-select
        ariaLabel="Account kind"
        name="kind"
        formControlName="kind"
        [options]="kindOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [filter]="false"
        filterBy="label" /></label
    ><label
      >Currency<p-select
        ariaLabel="Currency"
        name="currency"
        formControlName="currency"
        [options]="currencies"
        optionLabel="code"
        optionValue="code"
        appendTo="body"
        [filter]="true"
        filterBy="code"
    /></label>
  </div>
  <label
    >Bank website<input
      type="text"
      inputmode="url"
      name="websiteUrl"
      formControlName="websiteUrl"
      placeholder="www.your-bank.com"
    /><small
      >We find and cache the website’s icon. Blocked websites use Google’s public favicon cache (domain only). Leave
      blank for the default account icon.</small
    ></label
  >
  <label class="check"
    ><input type="checkbox" name="active" formControlName="active" />
    Active</label
  ><label class="check"
    ><input type="checkbox" name="net" formControlName="includeNetWorth" />
    Include in net worth</label
  >
  <div class="dialog-footer">
    <button class="primary" [disabled]="saving || form.invalid">
      Save account
    </button>
  </div>
</form>
