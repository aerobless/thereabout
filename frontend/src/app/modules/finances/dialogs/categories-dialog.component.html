<form [formGroup]="form" class="category-editor" (ngSubmit)="saveCategory()">
  <input
    aria-label="Category name"
    required
    name="name"
    formControlName="name"
    placeholder="Category name"
  /><button class="app-button primary" [disabled]="saving || form.invalid">
    {{ form.controls.id.value ? "Save changes" : "Add category" }}
  </button>
  @if (form.controls.id.value) {
    <button class="app-button" type="button" (click)="reset()">New</button>
  }
</form>
<div class="category-list">
  @for (c of categories; track c.id) {
    <button class="app-button" (click)="editCategory(c)">
      {{ c.name }} <i class="pi pi-pencil"></i>
    </button>
  }
</div>
