<div class="finance-page">
  <header class="page-heading">
    <div>
      <a class="eyebrow" routerLink="/finances">THEREABOUT / FINANCES</a>
      <h1>Finances</h1>
      <p>A clearer view of what you have, spend and grow.</p>
    </div>
    <div class="actions">
      <finance-split-button label="Add transaction" icon="pi pi-plus" [primary]="true"
        [items]="transactionActions" (action)="dialogs.open({ kind: 'transaction' })" />
    </div>
  </header>
  <nav class="section-nav" aria-label="Finance navigation">
    @for (
      tab of ["overview", "accounts", "transactions", "reports"];
      track tab
    ) {
      <a
        [routerLink]="tab === 'overview' ? '/finances' : '/finances/' + tab"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: tab === 'overview' }"
        ><i [class]="navIcons[tab]" aria-hidden="true"></i> {{ tab | titlecase }}</a
      >
    }
  </nav>
  @if (context.error() || context.metadata().error) {
    <div class="alert error" role="alert">
      {{ context.error() || context.metadata().error
      }}<button class="app-button" (click)="context.error.set('')" aria-label="Dismiss error">
        ×
      </button>
    </div>
  }
  <router-outlet /><finance-dialog-host />
</div>
